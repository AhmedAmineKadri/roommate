<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Add a workspace')}">
</head>
<body><a class="skip-link" href="#main">Skip to content</a>
<header th:replace="~{fragments/layout :: header('admin')}">
</header>
<main id="main" class="page"><a class="back-link" th:href="@{/modifyroom/{id}(id=${roomId})}">← Back to management</a>
<div class="page-heading">
<p class="eyebrow">MAKE ROOM FOR WORK</p>
<h1>Add a workspace.</h1>
<p class="lead">Give your desk a clear, recognizable name.</p>
</div>
<section class="panel form-panel">
<div class="alert" th:if="${error}" th:text="${error}" role="alert">
</div>
<form th:action="@{/addarbeitsplatz/{id}(id=${roomId})}" method="post">
<div class="field"><label for="arbeitsplatzName">Workspace name</label><input id="arbeitsplatzName" name="arbeitsplatzName" type="text" required maxlength="300" placeholder="e.g. Window desk" th:value="${name}"><small class="muted">Choose a name people will recognize.</small>
</div>
<div class="actions"><button class="button" type="submit">Create workspace →</button><a class="text-link" th:href="@{/modifyroom/{id}(id=${roomId})}">Cancel</a>
</div>
</form>
</section>
</main>
<footer th:replace="~{fragments/layout :: footer}">
</footer>
</body>
</html>
